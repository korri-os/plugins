# Pages deployment reads the latest cache-index, never the source checkout.
# Explicit dispatch also covers publications made with GITHUB_TOKEN.
name: cache-pages

on:
  push:
    branches: [cache-index]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cache-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: cache-index
          persist-credentials: false
      - name: Stage the cache index without modifying metadata
        run: |
          mkdir _site
          cp nix-cache-info .nojekyll _site/
          find . -maxdepth 1 -type f -name '*.narinfo' -exec cp -- {} _site/ \;
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment
