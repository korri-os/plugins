name: Check all plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_lookup_only:
        description: "Run only the read-only publisher-token draft lookup probe"
        type: boolean
        default: false
      lookup_tag:
        description: "Existing draft tag for the read-only lookup probe"
        type: string
      lookup_id:
        description: "Expected existing draft release ID"
        type: string

permissions:
  contents: read

# Regression runs must neither share publication's concurrency group nor have
# access to its environment/signing key. A failed runtime does not cancel a batch.
concurrency:
  group: plugin-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-lookup:
    if: github.event_name == 'workflow_dispatch' && inputs.release_lookup_only && github.actor == 'simonwjackson' && github.triggering_actor == 'simonwjackson'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Match publication's GITHUB_TOKEN permission to prove draft visibility.
    # No signing environment, uploads, release changes or index writes.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Read the draft with the publisher's token permissions
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          LOOKUP_TAG: ${{ inputs.lookup_tag }}
          LOOKUP_ID: ${{ inputs.lookup_id }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          python3 - <<'PY'
          import json, os, runpy, time
          tag, identity = os.environ["LOOKUP_TAG"], int(os.environ["LOOKUP_ID"])
          assert tag and identity > 0
          publisher = runpy.run_path("nix/github-cache.py")
          start = time.monotonic()
          records = publisher["release_records"]("korri-os/plugins", tag)
          assert len(records) == 1 and records[0]["id"] == identity and records[0]["draft"]
          current = publisher["release"]("korri-os/plugins", tag)
          assert current["id"] == identity and current["draft"]
          print(json.dumps({key: current[key] for key in ("id", "tag_name", "draft", "immutable")}))
          print(f"Read-only lookup passed in {time.monotonic() - start:.3f}s")
          PY
  check:
    if: github.event_name != 'workflow_dispatch' || !inputs.release_lookup_only
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          install_url: https://releases.nixos.org/nix/nix-2.34.1/install
      - name: Read existing signed publisher cache
        run: python3 .github/workflows/trust-plugin-caches.py
      - name: Configure scoped read-only GitHub source authentication
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sudo --preserve-env=GITHUB_TOKEN,GITHUB_ENV,NIX_CONFIG python3 .github/workflows/source-auth.py setup --nix "$(command -v nix)"
      - name: Test the private Steam engine map step
        run: python3 .github/workflows/test-steam-engine-map.py
      - name: Verify publication scope
        run: python3 nix/publication-checks-test.py
      - name: Full regression checks without competing check builds
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          nix run ".#ci.tools.$SYSTEM.korri-retroarch-check"
          nix eval --json ".#ci.checks.$SYSTEM" --apply builtins.attrNames > "$RUNNER_TEMP/check-names.json"
          python3 -c 'import json, sys; print("\n".join(json.load(open(sys.argv[1]))))' "$RUNNER_TEMP/check-names.json" > "$RUNNER_TEMP/check-names.txt"
          # GitHub's hosted ARM runner has no usable KVM, and Core's plugin-host
          # VM test requires the `kvm` system feature, so Nix refuses to start it
          # there. The x86_64 job still runs it. Owner decision, 2026-11-12.
          if [ "$SYSTEM" = aarch64-linux ]; then
            grep -vx korri-runtime-plugin-host "$RUNNER_TEMP/check-names.txt" > "$RUNNER_TEMP/check-names.kept" || true
            mv "$RUNNER_TEMP/check-names.kept" "$RUNNER_TEMP/check-names.txt"
          fi
          # In particular, VM boot and native window tests must not compete with
          # unrelated Nix builds on the same small hosted runner.
          failed=0
          while IFS= read -r check; do
            if ! nix build --no-link --print-build-logs --max-jobs 1 ".#ci.checks.$SYSTEM.$check"; then
              failed=1
            fi
          done < "$RUNNER_TEMP/check-names.txt"
          test "$failed" = 0
      - name: Remove source credentials
        if: always()
        run: sudo --preserve-env=GITHUB_ENV,NIX_CONFIG python3 .github/workflows/source-auth.py cleanup
