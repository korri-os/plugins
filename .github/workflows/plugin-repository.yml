name: Publish Nix cache

on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Package output names separated by spaces; one or more per batch"
        required: true
        default: korri-tailscale korri-plugin-retroarch korri-plugin-mgba korri-plugin-ssh
        type: string
      tag:
        description: "Batch tag, not a plugin version; must name this main commit before publication"
        required: true
        type: string
      cache_tag:
        description: "Existing public mutable release for Nix metadata"
        required: true
        default: cache
        type: string
      publish:
        description: "Publish verified NAR assets and append signed cache metadata"
        default: false
        type: boolean

permissions:
  contents: read

# All batches share cache metadata. Never cancel an in-flight publication.
concurrency:
  group: plugin-binary-cache
  cancel-in-progress: false

env:
  NAR_TAG: ${{ inputs.tag }}
  CACHE_TAG: ${{ inputs.cache_tag }}
  PACKAGES: ${{ inputs.packages }}

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'simonwjackson' && github.triggering_actor == 'simonwjackson'
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    environment: plugin-release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate the destination and test the publisher
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          nix run .#korri-cache -- validate --repo "$GITHUB_REPOSITORY" --tag "$NAR_TAG" --cache-tag "$CACHE_TAG"
          test_output=$(nix build --no-link --print-out-paths ".#checks.$SYSTEM.korri-github-cache")
          nix build --no-link ".#checks.$SYSTEM.korri-device-cache" ".#checks.$SYSTEM.korri-tailscale-package" ".#checks.$SYSTEM.korri-ssh-upstream" ".#checks.$SYSTEM.korri-ssh-host-support"
          python3 nix/github-cache-export-test.py "$test_output"
          nix build --out-link cache-tool .#korri-cache
      - name: Build the selected packages without a signing key
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          read -ra selected_outputs <<< "$PACKAGES"
          ./cache-tool/bin/korri-cache build --system "$SYSTEM" --paths-file "$RUNNER_TEMP/paths.txt" "${selected_outputs[@]}"
      - name: Sign and prepare the Nix cache without content-address conversion
        env:
          SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          PUBLISH: ${{ inputs.publish }}
          SYSTEM: ${{ matrix.system }}
        run: |
          umask 077
          key="$RUNNER_TEMP/cache-key"
          trap 'rm -f "$key"' EXIT
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s\n' "$SIGNING_KEY" > "$key"
          elif [ "$PUBLISH" = true ]; then
            echo 'NIX_CACHE_SIGNING_KEY is required before publication' >&2
            exit 1
          else
            nix-store --generate-binary-cache-key ci-test-only "$key" "$RUNNER_TEMP/cache-public-key"
          fi
          unset SIGNING_KEY
          mapfile -t paths < "$RUNNER_TEMP/paths.txt"
          ./cache-tool/bin/korri-cache export "$RUNNER_TEMP/file-cache" --key-file "$key" "${paths[@]}"
          ./cache-tool/bin/korri-cache prepare "$RUNNER_TEMP/file-cache" "$RUNNER_TEMP/prepared" --nar-base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$NAR_TAG/" --upstream-cache https://cache.nixos.org
          cp "$RUNNER_TEMP/paths.txt" "$RUNNER_TEMP/prepared/paths-$SYSTEM.txt"
          printf '%s\n' "$GITHUB_SHA" > "$RUNNER_TEMP/prepared/revision.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cache-${{ matrix.system }}
          path: ${{ runner.temp }}/prepared/
          if-no-files-found: error
          retention-days: 7

  lifecycle:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'simonwjackson' && github.triggering_actor == 'simonwjackson'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Existing cold-host lifecycle acceptance
        run: nix build --no-link .#checks.x86_64-linux.korri-runtime-plugin-host

  publish:
    needs: [build, lifecycle]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'simonwjackson' && github.triggering_actor == 'simonwjackson' && inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: plugin-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cache-*
          path: artifacts
      - name: Prepare the tool before exposing a write token
        run: |
          nix build --out-link cache-tool .#korri-cache
          ./cache-tool/bin/korri-cache combine prepared artifacts/cache-x86_64-linux artifacts/cache-aarch64-linux
      - name: Publish the batch then append cache metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./cache-tool/bin/korri-cache publish prepared --repo "$GITHUB_REPOSITORY" --tag "$NAR_TAG" --cache-tag "$CACHE_TAG" --revision "$GITHUB_SHA"
